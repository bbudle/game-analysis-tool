function enableMapPan(){
 const viewport=$('#viewport');let drag=null,suppressClick=false;
 viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('input,textarea,button,a,select'))return;
  const r=viewport.getBoundingClientRect();if(e.clientX-r.left>=viewport.clientWidth||e.clientY-r.top>=viewport.clientHeight)return;
  suppressClick=false;drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop,moved:false};
 });
 viewport.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<5)return;
  if(!drag.moved){drag.moved=true;suppressClick=true;viewport.setPointerCapture(e.pointerId);viewport.classList.add('panning')}
  e.preventDefault();viewport.scrollLeft=drag.left-dx;viewport.scrollTop=drag.top-dy;
 });
 const finish=e=>{if(!drag||e.pointerId!==drag.id)return;if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId);drag=null;viewport.classList.remove('panning')};
 viewport.addEventListener('pointerup',finish);viewport.addEventListener('pointercancel',finish);
 viewport.addEventListener('lostpointercapture',()=>{drag=null;viewport.classList.remove('panning')});
 viewport.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}},true);
}

].map(([x,t,d])=>`<g><rect x="${x}" y="35" width="190" height="65" rx="9" fill="#214b3f" stroke="#658773"/><text x="${x+95}" y="61" text-anchor="middle" fill="#e3eadb" font-size="14" font-weight="600">${t}</text><text x="${x+95}" y="83" text-anchor="middle" fill="#a8c0aa" font-size="11">${d}</text></g>`).join('')}${steps.map((a,i)=>`<g data-cycle="${a.id}" class="cycle-step" tabindex="0" role="button" aria-pressed="false" aria-label="${a.title} 설명 보기" transform="translate(${a.x} ${a.y})"><rect width="190" height="102" rx="14" fill="#f3f3e5" stroke="#c5d6a9"/><text x="18" y="27" fill="#7b8d6d" font-size="11">0${i+1}</text><text x="95" y="49" text-anchor="middle" fill="#173d30" font-size="27" font-weight="700">${a.title}</text><text x="95" y="79" text-anchor="middle" fill="#62735b" font-size="12">${a.sub}</text></g>`).join('')}<text x="580" y="375" text-anchor="middle" fill="#93ae95" font-size="11">동료 획득 → 파견 배치 → 재료 보상은 성장 순환을 보조합니다.</text></svg></div><div class="cycle-caption" id="cycleCaption" aria-live="polite"><span>성장 체감</span><p>전투 → 보상 → 성장 → 돌파. 카드를 선택하면 상세 설명을 볼 수 있습니다.</p></div></section><p class="cycle-footnote">플레이 관찰 기반 기획 해석 · 재화별 공급·소비 관계와 확인 상태는 콘텐츠 구조도에서 확인</p>${atlasNavigation()}</section>`;
let active=null;document.querySelectorAll('[data-cycle]').forEach(el=>{const go=()=>{active=active===el.dataset.cycle?null:el.dataset.cycle;document.querySelectorAll('[data-cycle]').forEach(x=>{x.setAttribute('aria-pressed',String(x.dataset.cycle===active));x.classList.toggle('chosen',x.dataset.cycle===active)});let a=steps.find(x=>x.id===active);$('#cycleCaption').innerHTML=a?`<span>${a.title}</span><p>${a.detail}</p>`:'<span>성장 체감</span><p>전투 → 보상 → 성장 → 돌파. 카드를 선택하면 상세 설명을 볼 수 있습니다.</p>'};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});$('#saveCycle').onclick=exportSvg;enableMapPan();wireAtlasNavigation();}


function atlasNavigation(){return `<section class="atlas-navigation" aria-label="구조도 선택"><div class="nav-heading"><strong>상세 구조도 살펴보기</strong><span>콘텐츠 관계와 구현 설계</span></div><nav class="atlas-cards">${[
 ['content','01','콘텐츠 구조도','무엇을 얻고 어디에 사용하는가','콘텐츠 · 보상 · 성장 관계 보기'],
 ['system','02','시스템 구조도','각 기능은 어떻게 작동하는가','규칙 · 조건 · 테이블 보기']
].map(([id,num,title,q,action])=>`<a href="#game/${game.id}/${id}" class="atlas-choice ${mode===id?'current':''}" ${mode===id?'aria-current="page"':''}><div class="choice-top"><span>${num}</span><b>${mode===id?'현재 보는 화면':'열어보기 ↗'}</b></div><h3>${title}</h3><p>${q}</p><strong>${action} ${mode===id?'':'→'}</strong></a>`).join('')}</nav></section><nav class="atlas-quick" aria-label="빠른 구조도 전환"><a href="#">← 게임 목록</a><span>${esc(game.name)}</span>${[['loop','게임 개요'],['content','콘텐츠 구조도'],['system','시스템 구조도']].map(([id,t])=>`<a href="#game/${game.id}/${id}" ${mode===id?'aria-current="page"':''}>${t}</a>`).join('')}</nav>`}
function wireAtlasNavigation(){if(window.atlasNavObserver)window.atlasNavObserver.disconnect();const block=$('.atlas-navigation'),quick=$('.atlas-quick');if(!block||!quick)return;window.atlasNavObserver=new IntersectionObserver(entries=>{quick.classList.toggle('visible',!entries[0].isIntersecting&&entries[0].boundingClientRect.bottom<0)},{threshold:0});window.atlasNavObserver.observe(block)}

function requestDeleteGame(id){
 if(BASE.games.some(g=>g.id===id))return;
 const target=saved.games.find(g=>g.id===id);if(!target)return;
 let dialog=document.createElement('dialog');dialog.className='delete-game-dialog';dialog.innerHTML=`<h2>내 게임 항목을 삭제할까요?</h2><p><strong>${esc(target.name)}</strong> 항목과 이 게임에 작성한 메모를 현재 브라우저에서 삭제합니다.</p><p class="notice">공개 게임 목록과 다른 사람의 데이터에는 영향을 주지 않습니다.</p><div class="dialogbuttons"><button type="button" data-cancel>취소</button><button type="button" class="danger-button" data-confirm>삭제하기</button></div>`;
 document.body.appendChild(dialog);dialog.addEventListener('close',()=>dialog.remove());dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();
 dialog.querySelector('[data-confirm]').onclick=()=>{const next={...saved,games:saved.games.filter(g=>g.id!==id),notes:Object.fromEntries(Object.entries(saved.notes).filter(([k])=>!k.startsWith(id+':')))};try{localStorage.setItem(KEY,JSON.stringify(next))}catch{toast('저장할 수 없어 삭제하지 않았습니다.');return}saved=next;games=games.filter(g=>g.id!==id);dialog.close();home();toast('내 게임 항목을 삭제했습니다.')};dialog.showModal();dialog.querySelector('[data-cancel]').focus();
}
</script></body></html>
